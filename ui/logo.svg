<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Freelance Guardian">
  <title>Freelance Guardian</title>
  <!-- A contract page with one clause struck through — the product's actual output,
       not a generic document icon. Drawn rather than imported so it inherits the
       palette, needs no attribution, and animates without a library. -->
  <rect x="6" y="2" width="20" height="28" rx="2" fill="#FAF9F6" stroke="#171412" stroke-width="1.6"/>
  <g stroke="#171412" stroke-width="1.4" stroke-linecap="round" opacity=".55">
    <path d="M10 9h12"/>
    <path d="M10 21h12"/>
    <path d="M10 25h8"/>
  </g>
  <!-- the redlined clause -->
  <path d="M10 15h12" stroke="#171412" stroke-width="1.4" stroke-linecap="round" opacity=".55"/>
  <path d="M9 15h14" stroke="#CE1F35" stroke-width="2" stroke-linecap="round">
    <animate attributeName="stroke-dasharray" values="0 14;14 0" dur="1.1s"
             begin="0s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.3 1"/>
  </path>
</svg>
