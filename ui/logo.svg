<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Freelance Guardian">
  <title>Freelance Guardian</title>
  <!-- A contract with one clause struck out — the product's actual output. A solid
       brand tile rather than an outlined page: at favicon size an outline collapses
       into a dark smudge, and the fill has to carry in both light and dark chrome. -->
  <rect width="32" height="32" rx="7" fill="#F26522"/>
  <g stroke="#fff" stroke-width="1.7" stroke-linecap="round" opacity=".85">
    <path d="M9 10h14"/>
    <path d="M9 16h14"/>
    <path d="M9 22h14"/>
    <path d="M9 27h9"/>
  </g>
  <path d="M8 16h16" stroke="#171412" stroke-width="2.4" stroke-linecap="round"/>
</svg>
